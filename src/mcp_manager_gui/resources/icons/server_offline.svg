<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Offline server status icon -->
  <defs>
    <linearGradient id="offlineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E8E93;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D6D70;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Server box -->
  <rect x="2" y="6" width="20" height="12" rx="2" ry="2" 
        fill="url(#offlineGradient)" stroke="none"/>
  
  <!-- Server details (dimmed) -->
  <rect x="4" y="8" width="2" height="1" rx="0.5" fill="white" opacity="0.4"/>
  <rect x="4" y="10" width="2" height="1" rx="0.5" fill="white" opacity="0.4"/>
  <rect x="4" y="12" width="2" height="1" rx="0.5" fill="white" opacity="0.4"/>
  <rect x="4" y="14" width="2" height="1" rx="0.5" fill="white" opacity="0.4"/>
  
  <!-- Status indicator -->
  <circle cx="18" cy="10" r="2" fill="white"/>
  <circle cx="18" cy="10" r="1" fill="#8E8E93"/>
  
  <!-- Disconnected indicator -->
  <g fill="white" opacity="0.4">
    <circle cx="8" cy="4" r="1"/>
    <circle cx="10" cy="4" r="1"/>
    <circle cx="12" cy="4" r="1"/>
  </g>
  
  <!-- X mark for offline -->
  <g stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <line x1="16" y1="8" x2="20" y2="12"/>
    <line x1="20" y1="8" x2="16" y2="12"/>
  </g>
</svg>