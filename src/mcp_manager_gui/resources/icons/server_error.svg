<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Error server status icon -->
  <defs>
    <linearGradient id="errorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3B30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D70015;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Server box -->
  <rect x="2" y="6" width="20" height="12" rx="2" ry="2" 
        fill="url(#errorGradient)" stroke="none"/>
  
  <!-- Server details -->
  <rect x="4" y="8" width="2" height="1" rx="0.5" fill="white" opacity="0.8"/>
  <rect x="4" y="10" width="2" height="1" rx="0.5" fill="white" opacity="0.8"/>
  <rect x="4" y="12" width="2" height="1" rx="0.5" fill="white" opacity="0.8"/>
  <rect x="4" y="14" width="2" height="1" rx="0.5" fill="white" opacity="0.8"/>
  
  <!-- Status indicator -->
  <circle cx="18" cy="10" r="2" fill="white"/>
  <circle cx="18" cy="10" r="1" fill="#FF3B30"/>
  
  <!-- Error indicator -->
  <g fill="white" opacity="0.9">
    <circle cx="8" cy="4" r="1"/>
    <circle cx="10" cy="4" r="1"/>
    <circle cx="12" cy="4" r="1"/>
    <!-- Jagged error lines -->
    <path d="M8 5 L8 6 M10 5 L9.5 6 M12 5 L12.5 6" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- Warning triangle -->
  <g fill="white" stroke="none">
    <path d="M18 7 L20 11 L16 11 Z"/>
    <circle cx="18" cy="9.5" r="0.5" fill="#FF3B30"/>
    <rect x="17.7" y="10.3" width="0.6" height="0.4" fill="#FF3B30"/>
  </g>
</svg>