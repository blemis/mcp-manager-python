<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional gradient definitions -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="70%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle with macOS styling -->
  <rect x="72" y="72" width="880" height="880" rx="176" ry="176" 
        fill="url(#mainGradient)" 
        filter="url(#dropshadow)"
        style="stroke:#1e40af;stroke-width:2;"/>
  
  <!-- Central geometric pattern representing interconnected servers -->
  <g transform="translate(512,512)">
    <!-- Main hub circle -->
    <circle cx="0" cy="0" r="80" fill="url(#accentGradient)" stroke="#ffffff" stroke-width="6"/>
    
    <!-- Server nodes arranged in a circle -->
    <g id="serverNodes">
      <!-- Node 1 - Top -->
      <g transform="rotate(0)">
        <line x1="0" y1="-80" x2="0" y2="-180" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
        <circle cx="0" cy="-180" r="24" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
      </g>
      
      <!-- Node 2 - Top Right -->
      <g transform="rotate(45)">
        <line x1="0" y1="-80" x2="0" y2="-160" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
        <circle cx="0" cy="-160" r="18" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
      </g>
      
      <!-- Node 3 - Right -->
      <g transform="rotate(90)">
        <line x1="0" y1="-80" x2="0" y2="-180" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
        <circle cx="0" cy="-180" r="24" fill="#8b5cf6" stroke="#ffffff" stroke-width="3"/>
      </g>
      
      <!-- Node 4 - Bottom Right -->
      <g transform="rotate(135)">
        <line x1="0" y1="-80" x2="0" y2="-160" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
        <circle cx="0" cy="-160" r="18" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      </g>
      
      <!-- Node 5 - Bottom -->
      <g transform="rotate(180)">
        <line x1="0" y1="-80" x2="0" y2="-180" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
        <circle cx="0" cy="-180" r="24" fill="#06b6d4" stroke="#ffffff" stroke-width="3"/>
      </g>
      
      <!-- Node 6 - Bottom Left -->
      <g transform="rotate(225)">
        <line x1="0" y1="-80" x2="0" y2="-160" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
        <circle cx="0" cy="-160" r="18" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      </g>
      
      <!-- Node 7 - Left -->
      <g transform="rotate(270)">
        <line x1="0" y1="-80" x2="0" y2="-180" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
        <circle cx="0" cy="-180" r="24" fill="#ec4899" stroke="#ffffff" stroke-width="3"/>
      </g>
      
      <!-- Node 8 - Top Left -->
      <g transform="rotate(315)">
        <line x1="0" y1="-80" x2="0" y2="-160" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
        <circle cx="0" cy="-160" r="18" fill="#84cc16" stroke="#ffffff" stroke-width="2"/>
      </g>
    </g>
    
    <!-- Central MCP logo/symbol -->
    <text x="0" y="8" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="32" font-weight="700" fill="#ffffff">MCP</text>
  </g>
  
  <!-- Subtle gear/settings icon in bottom right -->
  <g transform="translate(820, 820)">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" 
          fill="#ffffff" opacity="0.3" transform="scale(1.5)"/>
  </g>
  
  <!-- Center glow effect -->
  <circle cx="512" cy="512" r="200" fill="url(#centerGlow)"/>
  
  <!-- Subtle border highlight -->
  <rect x="74" y="74" width="876" height="876" rx="174" ry="174" 
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
</svg>